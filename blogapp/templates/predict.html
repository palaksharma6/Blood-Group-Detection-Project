<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predict</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            overflow: hidden;
        }

        /* Blurred Background (New Fingerprint Image) */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('{{ url_for('static', filename='img4.jpg') }}') no-repeat center center;
            background-size: cover;
            filter: blur(10px);
            z-index: -1;
        }

        /* Container with Glassmorphism */
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 420px;
            color: #fff;
            animation: slideFadeIn 1s ease;
        }

        @keyframes slideFadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -40%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        h2 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        /* Hide default file input */
        input[type="file"] {
            display: none;
        }

        /* Upload Button Style */
        .custom-file-upload {
            display: block;
            background: linear-gradient(to right, #d50000, #ff1744);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        .custom-file-upload:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #ff1744;
        }

        input[type="submit"] {
            background: linear-gradient(to right, #004d40, #00796b);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        input[type="submit"]:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00bfa5;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #80cbc4;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #b2dfdb;
        }

        @media screen and (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="container">
        <h2>Upload Fingerprint</h2>
        <form method="POST" enctype="multipart/form-data">
            <label for="file-upload" class="custom-file-upload">
                📎 Choose Fingerprint Image
            </label>
            <input id="file-upload" type="file" name="image" required>
            <input type="submit" value="🔍 Predict Blood Group">
        </form>
        <a href="{{ url_for('home') }}">← Back to Home</a>
    </div>

</body>
</html>
